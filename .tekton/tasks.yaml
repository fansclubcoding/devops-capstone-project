apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task runs nose tests.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to flake8
      type: string
      default: "--count --max-complexity=10 --max-line-length=127 service/"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "Running nosetests..."
        nosetests $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: This task runs flake8 linting.
  workspaces:
    - name: source
  params:
    - name: image
      description: The image to use
      type: string
      default: "python:3.9-slim"
    - name: args
      description: Arguments to pass to flake8
      type: string
      default: "--count --max-complexity=10 --max-line-length=127 service/"
  steps:
    - name: lint
      image: "$(params.image)"
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing flake8..."
        python -m pip install --upgrade pip
        pip install flake8
        echo "Running flake8..."
        flake8 $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: This task deploys the application to Kubernetes.
  workspaces:
    - name: source
  steps:
    - name: kubectl-deploy
      image: rancher/kubectl:v1.28.4
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Applying deployment.yaml..."
        kubectl apply -f deployment.yaml
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/accounts
        echo "Deployment completed successfully."
